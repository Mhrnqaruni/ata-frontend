<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- === FONT LOADING START === -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- === FONT LOADING END === -->
    
    <!-- theme before the first paint: the sign-in page and every screen start in the chosen theme (no white flash) -->
    <script>
      (function () {
        var mode = "dark";
        try { mode = localStorage.getItem("themeMode") === "light" ? "light" : "dark"; } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme-mode", mode);
        root.style.colorScheme = mode;
        root.style.background = mode === "dark" ? "#060a1a" : "#f4f6fc";
      })();
    </script>
    <title>MST - My Smart Teach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
